name: Suivi Immoweb Bruxelles

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer le navigateur virtuel
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Lancer le relevé Immoweb
        run: python tracker.py

      - name: Sauvegarder automatiquement dans le dépôt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour quotidienne des annonces Immoweb"
          file_pattern: locations_bruxelles.csv
