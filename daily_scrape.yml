name: Suivi Immoweb Bruxelles

on:
  schedule:
    - cron: '0 7 * * *' # Exécution tous les jours à 7h00 UTC (8h00 en hiver / 9h00 en été en Belgique)
  workflow_dispatch: # Permet de lancer un test manuellement en un clic

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer le navigateur virtuel
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Lancer le relevé Immoweb
        run: python tracker.py

      - name: Sauvegarder les résultats dans le tableau CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add locations_bruxelles.csv
          git commit -m "Ajout du relevé quotidien" || exit 0
          git push
